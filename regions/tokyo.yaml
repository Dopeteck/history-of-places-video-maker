name: Tokyo
slug: tokyo
country: Japan
languages: [Japanese, English]
place_names:
  - spelling: Edo
    pronunciation_hint: "EH-doh"
  - spelling: Tokugawa Ieyasu
    pronunciation_hint: "toh-koo-GAH-wah ee-eh-YAH-soo"
  - spelling: Nihonbashi
    pronunciation_hint: "nee-hohn-bah-shee"
  - spelling: Kyoto
    pronunciation_hint: "kee-OH-toh"
period_focus: "Edo to Tokyo, 1603 to the present"
story:
  hook: "Tokyo was once a different city with a different name: Edo."
  closing_tip: "Visit Nihonbashi and a nearby garden, then look for Edo’s street pattern beneath modern Tokyo."
  narration: "Tokyo was once known as Edo, a castle town that changed Japan’s future. In 1603, Tokugawa Ieyasu established his shogunate here, and Edo grew into a powerful political center. Merchants filled its streets, boats moved goods along canals, and artists turned everyday life into celebrated woodblock prints. By the eighteenth century, Edo was one of the world’s great cities, even while the imperial court remained in Kyoto. Then came 1868: the shogunate ended, the emperor’s government moved east, and Edo became Tokyo, the eastern capital. Fires, earthquakes, and war transformed the city, but its older story never disappeared completely. Look closely at gardens, temple grounds, street plans, and Nihonbashi, once a vital bridge for journeys across Japan. Today, Tokyo layers modern towers over centuries of history. Choose one historic district, walk slowly, and let the old city emerge between the new."
sources:
  - https://en.wikipedia.org/wiki/Tokyo
  - https://en.wikipedia.org/wiki/Edo
  - https://www.gotokyo.org/en/
  - https://www.ndl.go.jp/landmarks/e/
claim_sources:
  "Edo became a major political centre under Tokugawa rule": [https://en.wikipedia.org/wiki/Edo, https://en.wikipedia.org/wiki/Tokugawa_shogunate]
  "The shogunate was established in 1603": [https://en.wikipedia.org/wiki/Tokugawa_Ieyasu, https://en.wikipedia.org/wiki/Tokugawa_shogunate]
  "Edo developed a rich merchant, canal, print and theatre culture": [https://en.wikipedia.org/wiki/Edo, https://www.ndl.go.jp/landmarks/e/]
  "The imperial court remained in Kyoto before the Meiji Restoration": [https://en.wikipedia.org/wiki/Capital_of_Japan]
  "Edo became Tokyo during the 1868 political transition": [https://en.wikipedia.org/wiki/Tokyo, https://en.wikipedia.org/wiki/Meiji_Restoration]
  "Nihonbashi was a key bridge and starting point for major roads": [https://en.wikipedia.org/wiki/Nihonbashi, https://www.ndl.go.jp/landmarks/e/]
visual_style:
  palette: [ink-black, warm-ivory, vermilion]
  accent_color: "#E65A45"
  music_mood: "restrained, reflective plucked strings and soft city ambience"
  notes: "Use Edo-period print warmth for historic scenes and cooler steel-blue contrast for contemporary Tokyo."
image_banned_terms: [cover, catalogue, catalog, report, document, page, manuscript, statement, plate list, exhibition, book, banner, poster, logo, flyer, signage, conference, meetup, event, collage, montage, "composite image"]
map:
  latitude: 35.6762
  longitude: 139.6503
  label: "TOKYO"
  country: "Japan"
  span_deg: 9
  connect: true
  places:
    - {label: "Kyoto", latitude: 35.0116, longitude: 135.7681}
# Scene order follows the narration. `starts_at` is the phrase in the narration where the cut lands.
# Search: named_entities and visual_tags are tried first; keep queries short (museum APIs match few words best).
# required_keywords only rank candidates (and hard-filter free-text Commons search); CLIP decides relevance.
scenes:
