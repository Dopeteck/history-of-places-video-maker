story:
  hook: "Before the City of Light, there was a river island settlement."
  hook_variants:
    A: "PARIS BEGAN ON AN ISLAND"
    B: "THE ISLAND THAT BECAME PARIS"
  closing_tip: "Walk from Notre-Dame to the Louvre at sunset, and trace the Seine's curve through centuries."
  narration_language: "French"
  kokoro_voice: "ff_siwis"
  smoke_test_text: "Paris a commencé sur une île."
  narration: "Before Paris became the City of Light, it was a modest settlement on the Île de la Cité, where the Seine curves around a defensible island. The Romans knew it as Lutetia, a Gallic town that grew into a regional capital. By the 10th century, the Capetian kings made Paris their seat, and the city expanded beyond its island cradle onto both banks. Notre-Dame rose from the 12th century onward, a Gothic anchor for a growing university quarter. The Louvre began as a fortress, then a palace, before becoming the world's most visited museum. The French Revolution erupted in these streets, and Napoleon reshaped the city with triumphal arcs and grand boulevards. Haussmann's 19th-century renovation gave Paris its iconic stone facades and wide avenues, while the Eiffel Tower arrived for the 1889 World's Fair. Today, the Seine still threads through arrondissements where medieval alleys meet imperial grandeur, and every bridge crosses layers of history."
