name: "Tokyo: From Edo to a World City"
slug: tokyo-long-form-pilot
country: Japan
narration_language: English
story:
  narration_language: English
  narration: >-
    Before Tokyo became one of the world’s largest cities, it was known as Edo,
    a settlement beside the waters and inlets of eastern Japan. Its location
    connected local routes, fishing communities, and the broad plain around
    what would become the capital. The story of Tokyo is not a simple tale of
    one city suddenly appearing. It is a sequence of political choices,
    commercial growth, cultural invention, and repeated rebuilding.

    In 1603, Tokugawa Ieyasu established his shogunate in Edo. The emperor and
    imperial court remained in Kyoto, while Edo became the centre of the
    shogun’s military government. Lords from across Japan were drawn into a
    political system that helped make Edo a major administrative city. Roads,
    waterways, bridges, and markets connected the growing settlement. By the
    eighteenth century, Edo had become a huge urban centre, supported by
    merchants, craftsmen, servants, performers, and travellers.

    Daily life gave Edo its distinctive character. Boats moved goods through
    canals and rivers; bridges joined crowded districts; shops and workshops
    served residents whose work sustained the city. Woodblock prints carried
    views of streets, theatres, famous places, and changing seasons far beyond
    the people who could visit them. Artists such as Utagawa Hiroshige made
    landscapes and journeys part of a shared visual imagination. These images
    are not photographs, but they preserve details of how artists represented
    the city and its surroundings.

    The city’s history also survives in places that invite a slower look.
    Traditional gardens preserve carefully composed landscapes, while the
    Nihonbashi area recalls the importance of bridges, merchants, and national
    travel routes. Nihonbashi Bridge was established in the early Tokugawa
    period and became a key reference point for major roads. Such landmarks
    help connect the everyday city to wider networks of trade and movement.

    In 1868, amid the political transformation known as the Meiji Restoration,
    Edo was renamed Tokyo. The imperial court moved from Kyoto, and the city
    entered a new era of institutions, infrastructure, and urban change. Fires,
    earthquakes, war, and reconstruction repeatedly altered its appearance.
    Modern towers and rail lines now rise above a landscape still shaped by
    older routes, gardens, and memories. Tokyo is not one preserved historical
    scene; it is a layered city, where each era has left traces for the next.
