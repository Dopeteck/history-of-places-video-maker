story_angles:
- category: culture_traditions
  angle_id: mexico-city:culture:dia-de-muertos
  title: "Día de Muertos: From Aztec Miccaihuitl to Modern Celebration"
  hook: "Long before sugar skulls and marigolds, the Mexica honored the dead in a two-month summer festival."
  description: "Explore how the Indigenous Miccaihuitl festival merged with Catholic All Saints' Day to become today's Día de Muertos, with its ofrendas, cempasúchil, and pan de muerto. Distinguish documented pre-colonial practices from later syncretic traditions."
  entities: ["Miccaihuitl", "Mictēcacihuātl", "ofrenda", "cempasúchil"]
  sources: ["https://en.wikipedia.org/wiki/Day_of_the_Dead", "https://www.inah.gob.mx/", "https://whc.unesco.org/en/list/412"]
- category: hidden_history
  angle_id: mexico-city:hidden:chinampas
  title: "The Floating Gardens: Xochimilco's Chinampas"
  hook: "Artificial islands built on a lake fed an empire - and still grow food today."
  description: "How the Mexica created chinampas, highly productive floating gardens that fed Tenochtitlan's hundreds of thousands, and how these last surviving gardens persist in Xochimilco."
  entities: ["chinampa", "Xochimilco", "Tenochtitlan", "trajinera"]
  sources: ["https://en.wikipedia.org/wiki/Chinampa", "https://whc.unesco.org/en/list/412", "https://www.inah.gob.mx/"]
- category: independence_colonial
  angle_id: mexico-city:independence:1821
  title: "Independence in 1821: The Zócalo Transformed"
  hook: "When Mexico won independence in 1821, the colonial heart of the city became a symbol of a new nation."
  description: "The Zócalo's transformation from the ceremonial center of Tenochtitlan, to the main square of New Spain, to the site of independence celebrations in 1821."
  entities: ["Zócalo", "Metropolitan Cathedral", "Agustín de Iturbide", "Viceregal Palace"]
  sources: ["https://en.wikipedia.org/wiki/Z%C3%B3calo", "https://en.wikipedia.org/wiki/Mexican_War_of_Independence", "https://www.inah.gob.mx/"]
