period_focus: Aztec capital to modern metropolis, 14th century to present
story:
  hook: A city built on a lake became the heart of an empire.
  hook_variants:
    A: MEXICO CITY ROSE FROM LAKE
    B: 'TENOCHTITLAN: THE VENICE OF MESOAMERICA'
  closing_tip: Visit the Templo Mayor ruins beside the Zócalo, then take a trajinera
    through Xochimilco's canals.
  narration_language: Spanish
  kokoro_voice: ef_dora
  smoke_test_text: Ciudad de México nació en un lago.
  narration: 'Before it was Mexico City, this valley held a lake where the Mexica
    people founded Tenochtitlan in 1325, guided by an eagle on a cactus. Canals and
    chinampas, artificial gardens, fed a population of hundreds of thousands, making
    it one of the world''s largest cities. In 1521, Spanish forces besieged and destroyed
    the Aztec capital, building a colonial city atop its temples. The Zócalo, once
    the ceremonial center, became the main square of New Spain, flanked by the Metropolitan
    Cathedral and the Viceregal Palace. For three centuries, silver, trade, and faith
    shaped a baroque metropolis. Independence in 1821 brought turbulence, then the
    Porfiriato''s modernization: trams, drainage, and grand avenues like the Paseo
    de la Reforma. The 20th century brought revolution, muralism, and explosive growth,
    swallowing the lakebed. Today, the Templo Mayor''s stones emerge beside the Cathedral,
    and Xochimilco''s canals still carry trajineras through the last chinampas. A
    city of layers, where excavation reveals another century.'
  category: hidden_history
