story:
  hook: "A harbour changed this city."
  hook_variants:
    A: "A HARBOUR CHANGED THIS CITY"
    B: "HONG KONG BEFORE THE SKYLINE"
  closing_tip: "Walk the Central waterfront, then take the Star Ferry to see how the harbour still connects the city."
  narration_language: "English"
  kokoro_voice: "af_heart"
  smoke_test_text: "Hong Kong's story begins at the harbour."
  narration: "Hong Kong’s story begins long before its skyline. Fishing communities lived along this coast, where a deep, sheltered harbour made sea routes and trade central to daily life. In 1841, British forces occupied Hong Kong Island during the First Opium War; the 1842 Treaty of Nanking formalised its cession to Britain. Kowloon and the New Territories came under British control through later agreements, including the 1898 lease of the New Territories. Around Victoria Harbour, a trading settlement grew into a major port, shaped by Chinese communities as well as migration and global commerce. Not every chapter was prosperous: war, occupation, and crowded living conditions left deep marks. Kowloon Walled City, once a Qing military outpost, was demolished in the 1990s and replaced by a park preserving historic remains. On 1 July 1997, China resumed the exercise of sovereignty over Hong Kong. Today, ferries, old streets, heritage sites, and glass towers share the same compact landscape."
