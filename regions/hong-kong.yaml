    - https://www.amo.gov.hk/en/historic-buildings/monuments/kowloon/monuments_62/index.html
  "China resumed the exercise of sovereignty over Hong Kong on 1 July 1997":
    - https://www.edb.gov.hk/en/about-edb/press/cleartheair/20220802.html
