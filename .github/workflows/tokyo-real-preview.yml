name: Tokyo real rendered preview
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'destination-prototype/**'
      - 'destination-prototype/render_tokyo_real_preview.py'
      - '.github/workflows/tokyo-real-preview.yml'
permissions:
  contents: read
jobs:
  render-real-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/destination-history-shorts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow numpy soundfile kokoro==0.9.4
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Render real Tokyo-history video (fail closed; no placeholders)
        run: python destination-prototype/render_tokyo_real_preview.py
      - name: Upload validated MP4 and rights credits
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-real-rendered-preview
          path: |
            output/tokyo-real-preview/tokyo-history-preview.mp4
            output/tokyo-real-preview/credits.json
            output/tokyo-real-preview/validation.json
            output/tokyo-real-preview/mix.wav
          retention-days: 7
          if-no-files-found: error
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tokyo-real-preview-failure-diagnostics
          path: |
            output/tokyo-real-preview/credits.json
            output/tokyo-real-preview/validation.json
          retention-days: 7
          if-no-files-found: ignore
