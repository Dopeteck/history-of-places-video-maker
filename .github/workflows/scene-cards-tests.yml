name: Scene-card Stage 2 tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'scene_planner.py'
      - 'scene_assets.py'
      - 'scene_cards_cli.py'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/scene-cards-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full offline test suite
        run: python -m unittest discover -s tests -v
