name: Daily Global History Shorts Engine

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        type: choice
        options: [generate-candidates, select-topic, build-schedule, reset-state]
        default: select-topic
        required: true
      days:
        description: "Number of days for schedule"
        type: string
        default: "14"
        required: false
  schedule:
    # Run daily at 06:00 UTC to select and queue the next day's topic
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: daily-content-engine
  cancel-in-progress: false

jobs:
  daily-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install PyYAML

      - name: Run daily content engine
        id: engine
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ inputs.action }}"
            if [ "$ACTION" = "generate-candidates" ]; then
              python destination-prototype/daily_content_engine.py --generate-candidates
            elif [ "$ACTION" = "select-topic" ]; then
              python destination-prototype/daily_content_engine.py --select-topic
            elif [ "$ACTION" = "build-schedule" ]; then
              python destination-prototype/daily_content_engine.py --build-schedule ${{ inputs.days }}
            elif [ "$ACTION" = "reset-state" ]; then
              python destination-prototype/daily_content_engine.py --reset-state
            fi
          else
            # Scheduled run: select next topic and commit state
            python destination-prototype/daily_content_engine.py --select-topic
          fi

      - name: Commit state changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain destination-prototype/data/)" ]; then
            git add destination-prototype/data/
            git commit -m "daily: update editorial state $(date +%F)"
            git push
          else
            echo "No state changes to commit"
          fi

      - name: Upload schedule artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-schedule-${{ github.run_id }}
          path: destination-prototype/data/daily_schedule.json
          retention-days: 30

      - name: Upload candidates artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-candidates-${{ github.run_id }}
          path: destination-prototype/data/topic_candidates.json
          retention-days: 30