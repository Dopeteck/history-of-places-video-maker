name: Daily Global History Shorts Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        type: choice
        options: [generate-candidates, select-topic, build-schedule, reset-state, review, production]
        default: review
        required: true
      region:
        description: "Specific region slug (overrides topic selection)"
        type: string
        required: false
      hook-variant:
        description: "Hook variant (A or B)"
        type: choice
        options: [A, B]
        default: A
        required: false
      approve:
        description: "Explicit human approval for production render"
        type: boolean
        default: false
        required: false
      days:
        description: "Number of days for schedule"
        type: string
        default: "14"
        required: false
  schedule:
    # NOTE: Scheduled workflows only run on the default branch (usually main).
    # To enable daily scheduling:
    # 1. Merge this workflow to main branch, OR
    # 2. Change the branch filter below to 'feature/destination-history-shorts'
    # 3. Ensure GitHub Actions is enabled and has write permissions
    # Run daily at 06:00 UTC to prepare review package for next day
    - cron: "0 6 * * *"

permissions:
  contents: write  # Needed to commit editorial state

concurrency:
  group: daily-content-engine
  cancel-in-progress: false

jobs:
  daily-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML requests

      - name: Run daily orchestration
        id: orchestrate
        env:
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'review' }}"
          REGION="${{ github.event.inputs.region || '' }}"
          HOOK="${{ github.event.inputs.hook-variant || 'A' }}"
          APPROVE="${{ github.event.inputs.approve || 'false' }}"
          DAYS="${{ github.event.inputs.days || '14' }}"

          if [ "$MODE" = "generate-candidates" ]; then
            python destination-prototype/daily_content_engine.py --generate-candidates
          elif [ "$MODE" = "select-topic" ]; then
            python destination-prototype/daily_content_engine.py --select-topic
          elif [ "$MODE" = "build-schedule" ]; then
            python destination-prototype/daily_content_engine.py --build-schedule "$DAYS"
          elif [ "$MODE" = "reset-state" ]; then
            python destination-prototype/daily_content_engine.py --reset-state
          elif [ "$MODE" = "review" ]; then
            ARGS="--mode review --hook-variant $HOOK"
            if [ -n "$REGION" ]; then ARGS="$ARGS --region $REGION"; fi
            python destination-prototype/daily_orchestrate.py $ARGS
          elif [ "$MODE" = "production" ]; then
            ARGS="--mode production --hook-variant $HOOK"
            if [ -n "$REGION" ]; then ARGS="$ARGS --region $REGION"; fi
            if [ "$APPROVE" = "true" ]; then ARGS="$ARGS --approve"; fi
            python destination-prototype/daily_orchestrate.py $ARGS
          fi

      - name: Commit editorial state changes
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain destination-prototype/data/)" ]; then
            git add destination-prototype/data/
            git commit -m "daily: update editorial state $(date +%F)"
            git push
          else
            echo "No state changes to commit"
          fi

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-run-${{ github.run_id }}
          path: |
            destination-prototype/data/runs/
            destination-prototype/data/*.json
            !destination-prototype/data/runs/*/script_*.json
          retention-days: 30

      - name: Upload schedule artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-schedule-${{ github.run_id }}
          path: destination-prototype/data/daily_schedule.json
          retention-days: 30

      - name: Upload candidates artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topic-candidates-${{ github.run_id }}
          path: destination-prototype/data/topic_candidates.json
          retention-days: 30

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-records-${{ github.run_id }}
          path: destination-prototype/data/research_*.json
          retention-days: 30

      - name: Upload script artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-${{ github.run_id }}
          path: destination-prototype/data/script_*.json
          retention-days: 30