name: Prepare destination config
on:
  workflow_dispatch:
    inputs:
      destination:
        description: "City, landmark, region, or country to prepare"
        type: string
        required: true
      country:
        description: "Country the destination is in"
        type: string
        required: true
      slug:
        description: "Optional config slug (leave blank to generate from destination name)"
        type: string
        required: false
        default: ""
permissions:
  contents: read
jobs:
  draft-config:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination pipeline
        uses: actions/checkout@v4
        with:
          ref: feature/destination-history-shorts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install YAML dependency
        run: python -m pip install PyYAML
      - name: Generate an unverified destination draft
        env:
          DESTINATION: ${{ inputs.destination }}
          COUNTRY: ${{ inputs.country }}
          REQUESTED_SLUG: ${{ inputs.slug }}
        run: |
          python - <<'PY'
          import os, re, subprocess, sys
          destination = os.environ["DESTINATION"].strip()
          country = os.environ["COUNTRY"].strip()
          slug = re.sub(r"[^a-z0-9]+", "-", (os.environ.get("REQUESTED_SLUG") or destination).lower()).strip("-")
          if not destination or not country or not slug:
              raise SystemExit("Destination, country, and a usable slug are required.")
          output = f"output/destination-draft/{slug}.yaml"
          subprocess.run([
              sys.executable, "destination-prototype/make_region_config.py",
              destination, "--country", country, "--slug", slug, "--output", output
          ], check=True)
          print(f"Draft artifact: {output}")
          PY
      - name: Upload destination config draft
        uses: actions/upload-artifact@v4
        with:
          name: destination-config-draft-${{ github.run_id }}
          path: output/destination-draft/*.yaml
          if-no-files-found: error
          retention-days: 14
