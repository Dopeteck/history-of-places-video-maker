name: Kokoro narrated technical preview

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Kokoro voice for the preview
        type: choice
        required: true
        default: bm_george
        options:
          - bm_george
          - bm_fable
          - am_michael
      speed:
        description: Narration speed (0.7 to 1.3)
        type: string
        required: true
        default: "1.0"

permissions:
  contents: read

jobs:
  render-voice-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install FFmpeg and speech runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Install renderer dependencies
        run: python -m pip install -r requirements-render.txt
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install Kokoro voice dependencies
        run: python -m pip install -r requirements-voice.txt
      - name: Render real Kokoro narration preview
        env:
          PREVIEW_VOICE: ${{ inputs.voice }}
          PREVIEW_SPEED: ${{ inputs.speed }}
        run: |
          python - <<'PY'
          import os
          speed = float(os.environ["PREVIEW_SPEED"])
          if not 0.7 <= speed <= 1.3:
              raise SystemExit("speed must be between 0.7 and 1.3")
          PY
          python scripts/render_kokoro_preview.py --out output/kokoro-technical-preview --voice "$PREVIEW_VOICE" --speed "$PREVIEW_SPEED"
      - name: Upload preview video and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-technical-preview
          path: |
            output/kokoro-technical-preview/
          if-no-files-found: warn
          retention-days: 7
