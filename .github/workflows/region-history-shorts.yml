name: Region-driven history shorts
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Destination config slug under regions/ (e.g. hong-kong); add a reviewed config for new destinations"
        type: string
        default: tokyo
        required: true
      hook_variant:
        description: "Opening hook to render (must be human-approved for production)"
        type: choice
        options: [A, B]
        default: A
        required: true
      approved_review:
        description: "Path to reviewed JSON with approved=true and claim_sources for every factual claim"
        type: string
        required: false
      visual_review_only:
        description: "Fetch/rank scene images and upload an approval board without producing a publishable video"
        type: boolean
        default: false
        required: true
      only_scenes:
        description: "Optional comma-separated exact scene titles for a low-cost visual review"
        type: string
        required: false
        default: ""
      render_approved:
        description: "Render only after the named review file passes the approval gate"
        type: boolean
        default: false
        required: true
      draft_preview:
        description: "Render a non-publishable draft MP4; strict image, rights, relevance, and QA gates still apply"
        type: boolean
        default: false
        required: true
  push:
    branches:
      - feature/destination-history-shorts
    paths:
      - 'regions/**'
      - 'destination-prototype/render_region_short.py'
      - 'destination-prototype/asset_resolver.py'
      - 'destination-prototype/test_resolver_logic.py'
      - 'destination-prototype/region_slug.py'
      - 'destination-prototype/test_region_configs.py'
      - 'destination-prototype/vector_map.py'
      - 'destination-prototype/timing.py'
      - 'destination-prototype/data/**'
      - 'requirements-regions.txt'
      - '.github/workflows/region-history-shorts.yml'
  pull_request:
    paths:
      - 'regions/**'
      - 'destination-prototype/render_region_short.py'
      - 'destination-prototype/asset_resolver.py'
      - 'destination-prototype/vector_map.py'
      - 'destination-prototype/timing.py'
      - 'destination-prototype/data/**'
      - 'destination-prototype/test_resolver_logic.py'
      - 'destination-prototype/make_region_config.py'
      - 'destination-prototype/test_region_configs.py'
      - 'requirements-regions.txt'
      - 'README-regions.md'
      - '.github/workflows/region-history-shorts.yml'
permissions:
  contents: read
concurrency:
  group: region-history-${{ github.event.inputs.region || 'config-tests' }}
  cancel-in-progress: false
jobs:
  config-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ github.event_name == 'pull_request' && fromJSON('["tokyo","lagos"]') || fromJSON(format('["{0}"]', inputs.region || 'tokyo')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Normalize destination input
        id: normalize
        env:
          REGION_RAW: ${{ matrix.region }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys
          sys.path.insert(0, "destination-prototype")
          from region_slug import normalize_region_slug
          try:
              slug = normalize_region_slug(os.environ["REGION_RAW"])
          except ValueError as exc:
              raise SystemExit(str(exc))
          print(f"slug={slug}")
          PY
      - name: Install config and renderer dependencies
        run: |
          python -m pip install PyYAML requests Pillow numpy pytest
      - name: Compile Python and validate config shape
        env:
          REGION: ${{ steps.normalize.outputs.slug }}
        run: |
          python -m py_compile destination-prototype/render_region_short.py destination-prototype/asset_resolver.py destination-prototype/vector_map.py destination-prototype/timing.py destination-prototype/make_region_config.py destination-prototype/test_region_configs.py destination-prototype/region_slug.py
          python destination-prototype/test_region_configs.py
          python -m pytest destination-prototype/test_resolver_logic.py -q
          python - <<'PY'
          import pathlib, yaml, os
          region = os.environ["REGION"]
          p=pathlib.Path("regions") / (region+".yaml")
          if not p.is_file():
              raise SystemExit(f"Destination config not found: {p}. Create and review this config first; destination names normalize to lowercase hyphenated slugs.")
          d=yaml.safe_load(p.read_text(encoding="utf-8"))
          assert d.get("name") and d.get("country") and d.get("sources"), "missing region identity/sources"
          assert len(d.get("claim_sources",{})) >= 5, "each region needs a claim_sources map for historical assertions"
          assert 8 <= len(d.get("scenes",[])) <= 12, "expected 8–12 scenes"
          assert len(d.get("story",{}).get("narration","").split()) in range(110,156), "narration must be 110–155 words"
          assert all(s.startswith("https://") for s in d["sources"]), "source URLs must be HTTPS"
          for s in d["scenes"]:
            assert len(s.get("image_search_terms",[])) >= 3, s["title"]+" needs 3+ search variants"
            assert s.get("required_keywords"), s["title"]+" needs required keywords"
            assert s.get("image_type") in ("historic","modern","map"), s["title"]+" has invalid image_type"
          print("Config structure OK:", d["name"], "scenes=",len(d["scenes"]))
          PY
      - name: Require explicit story approval before rendering
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved
        env:
          REVIEW_PATH: ${{ inputs.approved_review }}
          REGION: ${{ steps.normalize.outputs.slug }}
          HOOK_VARIANT: ${{ inputs.hook_variant }}
        run: |
          python - <<'PY'
          import json, os, pathlib, yaml
          p=os.environ.get("REVIEW_PATH","")
          region=os.environ["REGION"]
          if not p or not pathlib.Path(p).is_file(): raise SystemExit("APPROVAL GATE FAILED: provide a reviewed JSON file committed in this branch")
          review=json.loads(pathlib.Path(p).read_text())
          cfg_path=pathlib.Path("regions",region+".yaml")
          if not cfg_path.is_file(): raise SystemExit(f"Destination config not found: {cfg_path}")
          cfg=yaml.safe_load(cfg_path.read_text())
          if review.get("region") != region or review.get("approved") is not True:
            raise SystemExit("APPROVAL GATE FAILED: review JSON must match normalized region slug and set approved=true")
          selected=os.environ.get("HOOK_VARIANT","A")
          if selected not in review.get("approved_hook_variants",[]):
            raise SystemExit("APPROVAL GATE FAILED: selected hook variant must be explicitly human-approved in the review JSON")
          mapping=review.get("claim_sources")
          expected=cfg.get("claim_sources",{})
          if not isinstance(mapping,dict) or not set(expected).issubset(mapping):
            raise SystemExit("APPROVAL GATE FAILED: review must map every config factual claim to reviewed source URLs")
          for claim in expected:
            urls=mapping[claim]
            if not isinstance(urls,list) or not urls or any(not str(u).startswith("https://") for u in urls):
              raise SystemExit("APPROVAL GATE FAILED: every factual claim needs one or more HTTPS sources: "+claim)
          if not review.get("reviewer") or not review.get("reviewed_at"):
            raise SystemExit("APPROVAL GATE FAILED: reviewer and reviewed_at are required")
          print("Review gate passed: all config claims have explicit source mappings and reviewer metadata.")
          PY
      - name: Install rendering dependencies
        if: (github.event_name == 'workflow_dispatch' && (inputs.render_approved || inputs.visual_review_only || inputs.draft_preview)) || github.event_name == 'push'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core tesseract-ocr
          python -m pip install -r requirements-regions.txt
          # Match the spaCy 3.8.x runtime pinned in requirements-regions.txt.
          python -m pip install --no-deps https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Verify Kokoro English voice pipeline initializes
        if: (github.event_name == 'workflow_dispatch' && (inputs.visual_review_only || inputs.render_approved || inputs.draft_preview)) || github.event_name == 'push'
        run: |
          python - <<'PY'
          from kokoro import KPipeline
          pipeline = KPipeline(lang_code="a")
          audio, sample_rate = next(pipeline("Tokyo's history begins with Edo.", voice="af_heart"))
          assert audio is not None and sample_rate > 0
          print(f"Kokoro English TTS smoke test passed at {sample_rate} Hz")
          PY
      - name: Verify CLIP model can score a known image
        if: (github.event_name == 'workflow_dispatch' && (inputs.visual_review_only || inputs.render_approved || inputs.draft_preview)) || github.event_name == 'push'
        run: |
          cd destination-prototype
          python - <<'PY'
          import io
          from PIL import Image
          from asset_resolver import _clip_analyze
          image = Image.new("RGB", (224, 224), (40, 90, 180))
          buf = io.BytesIO()
          image.save(buf, format="PNG")
          r = _clip_analyze("a blue image", [buf.getvalue()])[0]
          assert set(r) == {"score", "p_document", "p_modern"} and all(0.0 <= r[k] <= 1.0 for k in ("score", "p_document", "p_modern")) and -1.0 <= r["score"] <= 1.0, r
          print("CLIP smoke test passed:", r)
          PY
      - name: Render visual approval board (no audio / not publishable)
        if: (github.event_name == 'workflow_dispatch' && inputs.visual_review_only) || github.event_name == 'push'
        env:
          REGION_SLUG: ${{ steps.normalize.outputs.slug }}
          HOOK_VARIANT: ${{ inputs.hook_variant || 'A' }}
          ONLY_SCENES: ${{ inputs.only_scenes }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: |
          args=(--config "regions/${REGION_SLUG}.yaml" --hook-variant "$HOOK_VARIANT" --visual-review-only)
          if [ -n "$ONLY_SCENES" ]; then args+=(--only-scenes "$ONLY_SCENES"); fi
          python destination-prototype/render_region_short.py "${args[@]}"
      - name: Render non-publishable draft preview
        if: github.event_name == 'workflow_dispatch' && inputs.draft_preview && !inputs.visual_review_only
        env:
          REGION_SLUG: ${{ steps.normalize.outputs.slug }}
          HOOK_VARIANT: ${{ inputs.hook_variant }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: python destination-prototype/render_region_short.py --config "regions/${REGION_SLUG}.yaml" --hook-variant "$HOOK_VARIANT" --draft-preview
      - name: Render approved region short
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved && !inputs.visual_review_only
        env:
          REGION_SLUG: ${{ steps.normalize.outputs.slug }}
          HOOK_VARIANT: ${{ inputs.hook_variant }}
          SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: python destination-prototype/render_region_short.py --config "regions/${REGION_SLUG}.yaml" --hook-variant "$HOOK_VARIANT"
      - name: Upload reviewable region outputs
        if: always() && ((github.event_name == 'workflow_dispatch' && (inputs.render_approved || inputs.visual_review_only || inputs.draft_preview)) || github.event_name == 'push')
        uses: actions/upload-artifact@v4
        with:
          name: region-review-${{ steps.normalize.outputs.slug }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/${{ steps.normalize.outputs.slug }}-region-short/*.mp4
            output/${{ steps.normalize.outputs.slug }}-region-short/contact-sheet.jpg
            output/${{ steps.normalize.outputs.slug }}-region-short/approval-board.html
            output/${{ steps.normalize.outputs.slug }}-region-short/images/*
            output/${{ steps.normalize.outputs.slug }}-region-short/credits.json
            output/${{ steps.normalize.outputs.slug }}-region-short/credits-description.txt
            output/${{ steps.normalize.outputs.slug }}-region-short/qa-report.json
            output/${{ steps.normalize.outputs.slug }}-region-short/narration.txt
