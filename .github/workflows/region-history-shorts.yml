name: Region-driven history shorts
on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region slug under regions/"
        type: choice
        options: [tokyo, lagos]
        default: tokyo
        required: true
      approved_review:
        description: "Path to reviewed JSON with approved=true and claim_sources for every factual claim"
        type: string
        required: false
      render_approved:
        description: "Render only after the named review file passes the approval gate"
        type: boolean
        default: false
        required: true
  pull_request:
    paths:
      - 'regions/**'
      - 'destination-prototype/render_region_short.py'
      - 'destination-prototype/make_region_config.py'
      - '.github/workflows/region-history-shorts.yml'
permissions:
  contents: read
concurrency:
  group: region-history-${{ github.event.inputs.region || 'config-tests' }}
  cancel-in-progress: false
jobs:
  config-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        region: ${{ github.event_name == 'pull_request' && fromJSON('["tokyo","lagos"]') || fromJSON(format('["{0}"]', inputs.region || 'tokyo')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install config and renderer dependencies
        run: |
          python -m pip install PyYAML
      - name: Validate config shape and source list
        run: |
          python - <<'PY'
          import pathlib, yaml, os
          p=pathlib.Path("regions") / (os.environ['REGION']+".yaml")
          d=yaml.safe_load(p.read_text())
          assert d.get("name") and d.get("country") and d.get("sources"), "missing region identity/sources"
          assert 8 <= len(d.get("scenes",[])) <= 12, "expected 8–12 scenes"
          assert len(d.get("story",{}).get("narration","").split()) in range(110,156), "narration must be 110–155 words"
          assert all(s.startswith("https://") for s in d["sources"]), "source URLs must be HTTPS"
          for s in d["scenes"]:
            assert len(s.get("image_search_terms",[])) >= 3, s["title"]+" needs 3+ search variants"
            assert s.get("required_keywords"), s["title"]+" needs required keywords"
            assert s.get("image_type") in ("historic","modern","map"), s["title"]+" has invalid image_type"
          print("Config structure OK:", d["name"], "scenes=",len(d["scenes"]))
          PY
        env:
          REGION: ${{ matrix.region }}
      - name: Require explicit story approval before rendering
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved
        env:
          REVIEW_PATH: ${{ inputs.approved_review }}
          REGION: ${{ inputs.region }}
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          p=os.environ.get("REVIEW_PATH","")
          if not p or not pathlib.Path(p).is_file(): raise SystemExit("APPROVAL GATE FAILED: provide an existing reviewed JSON path in approved_review")
          d=json.loads(pathlib.Path(p).read_text())
          if d.get("region") != os.environ["REGION"] or d.get("approved") is not True:
            raise SystemExit("APPROVAL GATE FAILED: review JSON must match region and set approved=true")
          if not isinstance(d.get("claim_sources"),dict) or not d["claim_sources"]:
            raise SystemExit("APPROVAL GATE FAILED: claim_sources mapping is required for factual-claim traceability")
          print("Explicit review marker and claim-source mapping found.")
          PY
      - name: Install rendering dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core tesseract-ocr
          python -m pip install -r requirements-regions.txt
      - name: Render approved region short
        if: github.event_name == 'workflow_dispatch' && inputs.render_approved
        run: python destination-prototype/render_region_short.py --config regions/${{ inputs.region }}.yaml
      - name: Upload reviewable region outputs
        if: always() && github.event_name == 'workflow_dispatch' && inputs.render_approved
        uses: actions/upload-artifact@v4
        with:
          name: region-short-${{ inputs.region }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            output/${{ inputs.region }}-region-short/*.mp4
            output/${{ inputs.region }}-region-short/contact-sheet.jpg
            output/${{ inputs.region }}-region-short/credits.json
            output/${{ inputs.region }}-region-short/credits-description.txt
            output/${{ inputs.region }}-region-short/qa-report.json
            output/${{ inputs.region }}-region-short/narration.txt
